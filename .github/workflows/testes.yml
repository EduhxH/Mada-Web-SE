name: testes

# Corre em cada push e em cada pull request.
# O objetivo e simples: nunca descobrir uma semana depois que um commit
# partiu alguma coisa.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Correr os testes
        run: python -m pytest -q

      - name: Verificar que nenhum segredo foi commitado
        run: |
          for proibido in data/segredo.txt data/participantes.json .env; do
            if git ls-files --error-unmatch "$proibido" > /dev/null 2>&1; then
              echo "ERRO: $proibido esta versionado e nunca devia estar."
              exit 1
            fi
          done
          echo "Nenhum ficheiro sensivel versionado."
